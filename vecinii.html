<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="joc-inapoi" content="clasa0.html">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="icon" href="LOGO.png">
<link rel="stylesheet" href="joc.css">
<title>Vecinii numărului – Jocuri Logice</title>
<style>
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body { background: #F8F7FB; color: #231B33; min-height: 100dvh; padding: 62px 14px 30px; text-align: center; overscroll-behavior: none; }
    main { max-width: 520px; margin: 0 auto; }
    h1 { margin: 0; font-size: clamp(2rem, 8.5vw, 2.7rem); color: #4A2370; line-height: 1.1; }
    .sub { margin: 6px auto 12px; max-width: 36ch; font: 600 1.02rem/1.4 var(--j-font-text); color: #5B5270; }

    .levels { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-bottom: 12px; }
    .lv { min-height: 44px; padding: 0 16px; border: 2px solid #E6E2EE; border-radius: 999px; background: #fff; color: #5B5270; font: 700 .95rem var(--j-font); cursor: pointer; -webkit-tap-highlight-color: transparent; }
    .lv small { display: block; font: 700 .68rem var(--j-font-text); opacity: .8; }
    .lv.on { background: #4A2370; border-color: #4A2370; color: #fff; }

    .bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 4px 0 10px; }
    .prog { display: inline-flex; gap: 5px; flex-wrap: wrap; justify-content: flex-start; max-width: 70%; }
    .prog i { width: 12px; height: 12px; border-radius: 50%; background: #E6E2EE; } .prog i.on { background: #1FBF9A; } .prog i.cur { background: #FFB81C; }
    .pill { display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px; border-radius: 999px; background: #fff; border: 2px solid #E6E2EE; font: 700 1rem var(--j-font); color: #4A2370; }

    #card { background: #fff; border: 2px solid #E6E2EE; border-radius: 28px; padding: 16px 10px 18px; box-shadow: 0 14px 30px -20px rgba(35,27,51,.5); }
    #card.shake { animation: shake .35s; }
    @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
    .task { margin: 0 0 12px; font: 700 clamp(1.05rem, 4.6vw, 1.3rem)/1.3 var(--j-font); color: #4A2370; }

    .trio { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; justify-items: center; }
    .box { width: min(24vw, 92px); aspect-ratio: 1 / 1.05; border: 3px dashed #D9CCEB; border-radius: 22px; background: #F8F7FB; display: grid; place-items: center; font: 700 clamp(1.8rem, 9vw, 2.6rem) var(--j-font); color: #6A3BA0; cursor: default; transition: background .2s, border-color .2s; }
    .box.ask { border-style: solid; border-color: #E23B6B; background: #FFF0F5; box-shadow: 0 0 0 5px rgba(226,59,107,.14); animation: glow 1.2s infinite alternate; }
    .box.ok { border-style: solid; border-color: #1FBF9A; background: #DDF5EE; color: #0E6B58; }
    .box.bad { border-style: solid; border-color: #E23B6B; background: #FBC9D7; color: #B82A53; }
    .box.pick { border-style: solid; border-color: #6A3BA0; background: #EFE9F7; }
    @keyframes glow { to { box-shadow: 0 0 0 9px rgba(226,59,107,.06); } }
    .center { width: min(30vw, 112px); aspect-ratio: 1; border-radius: 50%; display: grid; place-items: center; font: 700 clamp(2.4rem, 13vw, 3.6rem) var(--j-font); color: #fff;
        background: radial-gradient(circle at 32% 28%, #A77BE6, #6A3BA0 55%, #4A2370); box-shadow: 0 12px 22px -10px rgba(74,35,112,.6), inset 0 3px 8px rgba(255,255,255,.3); }
    .labels { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; margin: 6px 0 12px; font: 800 .68rem var(--j-font-text); color: #5B5270; text-transform: uppercase; letter-spacing: .03em; }
    .labels span:nth-child(2) { width: min(30vw, 112px); text-align: center; }

    #prompt { margin: 6px 0 8px; font: 700 1.1rem var(--j-font); color: #4A2370; min-height: 1.4em; }
    .opts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .opt { min-height: 64px; border: 0; border-radius: 18px; font: 700 clamp(1.4rem, 7vw, 1.9rem) var(--j-font); color: #fff; cursor: pointer; box-shadow: 0 5px 0 rgba(35,27,51,.28); -webkit-tap-highlight-color: transparent; }
    .opt:nth-child(1) { background: #6A3BA0; } .opt:nth-child(2) { background: #E8541F; } .opt:nth-child(3) { background: #8E5BD6; } .opt:nth-child(4) { background: #D9356A; }
    .opt:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 2px 0 rgba(35,27,51,.28); }
    .opt:disabled { opacity: .5; cursor: default; }
    #msg { min-height: 1.6em; margin: 12px 0 0; font: 800 1.02rem/1.4 var(--j-font-text); color: #5B5270; }
    #msg.ok { color: #14937A; } #msg.bad { color: #B82A53; }

    #line { display: none; margin-top: 10px; padding: 12px 6px 8px; border-radius: 18px; background: #F8F7FB; border: 2px solid #E6E2EE; }
    #line.show { display: block; }
    #line p { margin: 0 0 8px; font: 800 .78rem var(--j-font-text); color: #5B5270; text-transform: uppercase; letter-spacing: .04em; }
    .nl { display: flex; justify-content: center; align-items: flex-end; }
    .nl div { flex: 1; position: relative; padding-top: 16px; font: 700 1.05rem var(--j-font); color: #8D829E; }
    .nl div::before { content: ""; position: absolute; top: 0; left: 50%; width: 9px; height: 9px; border-radius: 50%; background: #CBBCE0; transform: translateX(-50%); }
    .nl div::after { content: ""; position: absolute; top: 4px; left: 0; right: 0; height: 2px; background: #E0D6EE; z-index: -1; }
    .nl div.me { color: #4A2370; font-size: 1.3rem; } .nl div.me::before { width: 14px; height: 14px; background: #6A3BA0; top: -2px; }

    .hintBtn { margin-top: 12px; min-height: 46px; padding: 0 22px; border: 0; border-radius: 999px; background: #EFE9F7; color: #4A2370; font: 700 .98rem var(--j-font); cursor: pointer; box-shadow: 0 4px 0 #D9CCEB; }
    .hintBtn:disabled { opacity: .5; }
    .jg-overlay { position: fixed; } .stars { font-size: 2.4rem; letter-spacing: 4px; margin: 0; }
</style>
</head>
<body class="jg">
<main>
    <h1>Vecinii numărului</h1>
    <p class="sub">Găsește numărul de <b>dinainte</b> și numărul de <b>după</b>!</p>

    <div class="levels" id="levels">
        <button class="lv on" type="button" data-max="10">Începător<small>numere 0–10</small></button>
        <button class="lv" type="button" data-max="20">Explorator<small>numere 0–20</small></button>
        <button class="lv" type="button" data-max="31">Campion<small>numere 0–31</small></button>
    </div>

    <div class="bar"><div class="prog" id="prog"></div><span class="pill">⭐ <span id="score">0</span></span></div>

    <section id="card">
        <p class="task">Completează vecinii numărului!</p>
        <div class="trio">
            <div class="box" id="leftBox">?</div>
            <div class="center" id="center">5</div>
            <div class="box" id="rightBox">?</div>
        </div>
        <div class="labels"><span>Vecinul din stânga</span><span>Numărul dat</span><span>Vecinul din dreapta</span></div>

        <p id="prompt"></p>
        <div class="opts" id="options"></div>
        <p id="msg" role="status" aria-live="polite"></p>

        <div id="line"><p>Linia numerelor</p><div class="nl" id="nl"></div></div>
        <button class="hintBtn" id="hintBtn" type="button">💡 Arată linia numerelor</button>
    </section>
</main>

<div class="jg-overlay" id="overlay" hidden>
    <div class="jg-emoji" id="ovEmoji">🎉</div>
    <h1 class="jg-title">Bravo!</h1>
    <p class="stars" id="ovStars"></p>
    <p class="jg-text" id="ovText"></p>
    <button class="jg-btn" id="ovAgain" type="button">Joacă din nou</button>
</div>

<script>
const $ = (id) => document.getElementById(id);
const shuffle = (a) => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const TOTAL = 10, TOP = 10;                       // 10 exerciții, maxim 10 puncte fiecare
let maxN = 10, questions = [], round = 0, current = 1, score = 0;
let selL = null, selR = null, side = 'left', locked = false, hintUsed = false, mistakes = 0, timer = 0, perfect = 0;

function makeQuestions() {
    const pool = shuffle(Array.from({ length: maxN - 1 }, (_, i) => i + 1));      // centrul are mereu vecin și în stânga, și în dreapta
    questions = pool.slice(0, TOTAL);
    while (questions.length < TOTAL) { const last = questions[questions.length - 1], av = pool.filter(n => n !== last); questions.push(av[Math.floor(Math.random() * av.length)]); }
}
function startGame() {
    clearTimeout(timer); round = 0; score = 0; perfect = 0; makeQuestions(); $('score').textContent = '0'; $('overlay').hidden = true; nextQuestion();
}
function renderProg() { $('prog').innerHTML = Array.from({ length: TOTAL }, (_, i) => '<i class="' + (i < round ? 'on' : i === round ? 'cur' : '') + '"></i>').join(''); }
function nextQuestion() {
    if (round >= TOTAL) return finish();
    current = questions[round]; selL = selR = null; side = 'left'; locked = false; hintUsed = false; mistakes = 0;
    $('center').textContent = current; setBox('left', '?', 'ask'); setBox('right', '?', ''); msg('');
    $('line').classList.remove('show'); $('hintBtn').disabled = false; renderProg(); renderOptions();
}
function setBox(which, text, cls) { const b = $(which === 'left' ? 'leftBox' : 'rightBox'); b.textContent = text; b.className = 'box' + (cls ? ' ' + cls : ''); }
function msg(t, c) { $('msg').textContent = t; $('msg').className = c || ''; }

function renderOptions() {
    const correct = side === 'left' ? current - 1 : current + 1;
    $('prompt').textContent = side === 'left' ? 'Alege vecinul din stânga (cu 1 mai puțin).' : 'Alege vecinul din dreapta (cu 1 mai mult).';
    const near = [];
    for (let n = current - 4; n <= current + 4; n++) if (n >= 0 && n <= maxN && n !== current && n !== correct) near.push(n);
    const opts = shuffle([correct, ...shuffle(near).slice(0, 3)]);
    const box = $('options'); box.innerHTML = '';
    opts.forEach(n => { const b = document.createElement('button'); b.type = 'button'; b.className = 'opt'; b.textContent = n; b.addEventListener('click', () => pick(n)); box.appendChild(b); });
}
function pick(n) {
    if (locked) return;
    if (side === 'left') { selL = n; setBox('left', n, 'pick'); } else { selR = n; setBox('right', n, 'pick'); }
    if (selL !== null && selR !== null) return check();
    side = 'right'; setBox('right', '?', 'ask'); renderOptions();
}
function check() {
    const okL = selL === current - 1, okR = selR === current + 1;
    setBox('left', selL, okL ? 'ok' : 'bad'); setBox('right', selR, okR ? 'ok' : 'bad');
    if (okL && okR) {
        locked = true; const pts = hintUsed ? 5 : mistakes === 0 ? TOP : 7; score += pts; if (pts === TOP) perfect++; $('score').textContent = score;
        msg('Excelent! Ai găsit amândoi vecinii! ⭐', 'ok'); $('prompt').textContent = ''; $('options').innerHTML = ''; round++; renderProg();
        timer = setTimeout(nextQuestion, 1400); return;
    }
    mistakes++; $('card').classList.add('shake'); setTimeout(() => $('card').classList.remove('shake'), 400);
    msg(!okL && !okR ? 'Aproape! Încearcă din nou amândoi vecinii. 💜' : 'Aproape! Mai încearcă ' + (okL ? 'vecinul din dreapta' : 'vecinul din stânga') + '. 💜', 'bad');
    side = okL ? 'right' : 'left'; if (!okL) selL = null; if (!okR) selR = null;
    setBox(side === 'left' ? 'left' : 'right', '?', 'ask'); renderOptions();
}
function showLine() {
    if (locked) return; hintUsed = true; const nl = $('nl'); nl.innerHTML = '';
    for (let n = Math.max(0, current - 3); n <= Math.min(maxN, current + 3); n++) { const d = document.createElement('div'); d.textContent = n; if (n === current) d.className = 'me'; nl.appendChild(d); }
    $('line').classList.add('show'); $('hintBtn').disabled = true; msg('Pe linie, vecinul din stânga e înainte, iar cel din dreapta e după număr.');
}
function finish() {
    const pct = score / (TOTAL * TOP), stars = pct >= .85 ? 3 : pct >= .6 ? 2 : 1;
    $('ovStars').textContent = '⭐'.repeat(stars) + '☆'.repeat(3 - stars); $('ovEmoji').textContent = stars === 3 ? '🏆' : '🎉';
    $('ovText').textContent = 'Ai strâns ' + score + ' puncte din ' + (TOTAL * TOP) + '. Fără nicio greșeală sau ajutor: ' + perfect + ' din ' + TOTAL + ' exerciții.'; $('overlay').hidden = false;
}
document.querySelectorAll('.lv').forEach(b => b.addEventListener('click', () => { document.querySelectorAll('.lv').forEach(x => x.classList.remove('on')); b.classList.add('on'); maxN = Number(b.dataset.max); startGame(); }));
$('hintBtn').addEventListener('click', showLine); $('ovAgain').addEventListener('click', startGame);
startGame();
</script>
<script src="joc.js"></script>
</body>
</html>
