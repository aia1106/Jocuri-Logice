<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2A1450">
<title>Găina Jucăușă</title>
<style>
:root{--violet:#2A1450;--violet-2:#6A3BA0;--gold:#FFB81C;--gold-d:#C99A10;--ink:#231B33}
*{box-sizing:border-box}
body{margin:0;display:flex;justify-content:center;align-items:center;height:100dvh;background:var(--violet);font-family:"Nunito","Segoe UI",sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#game-container{position:relative;flex:none;transform-origin:center center;width:372px;height:652px;border:6px solid var(--violet-2);border-radius:28px;overflow:hidden;background:var(--violet);box-shadow:0 18px 40px -16px rgba(0,0,0,.6);touch-action:none}
#c{display:block;width:360px;height:640px}
#ui-layer{position:absolute;top:12px;left:0;width:calc(100% - 64px);padding-left:12px;display:flex;gap:8px;z-index:50;pointer-events:none}
.stat-box{background:#fff;color:var(--ink);font:700 1.05rem "Fredoka","Trebuchet MS",sans-serif;padding:6px 14px;border-radius:999px;box-shadow:0 4px 12px -4px rgba(0,0,0,.4)}
.stat-box.pop{animation:pop .22s}
@keyframes pop{50%{transform:scale(1.18)}}
#hint{position:absolute;left:0;right:0;bottom:8px;text-align:center;color:#fff;font:700 .8rem "Nunito",sans-serif;text-shadow:0 1px 3px rgba(0,0,0,.45);pointer-events:none;z-index:5;animation:hintOut .6s 5s forwards}
@keyframes hintOut{to{opacity:0}}
#game-over{position:absolute;inset:0;background:rgba(42,20,80,.92);display:none;flex-direction:column;justify-content:center;align-items:center;text-align:center;color:#fff;z-index:1000}
#game-over .big{font-size:3.5rem;line-height:1}
#game-over h1{margin:8px 0;color:#fff;font:700 2.4rem "Fredoka","Trebuchet MS",sans-serif}
#game-over p{margin:0;color:var(--gold);font:800 1.3rem "Nunito",sans-serif}
button{background:var(--gold);color:var(--ink);border:0;border-radius:999px;font:700 1.2rem "Fredoka","Trebuchet MS",sans-serif;min-height:56px;padding:0 32px;box-shadow:0 6px 0 var(--gold-d);margin-top:22px;cursor:pointer}
button:active{transform:translateY(4px);box-shadow:0 2px 0 var(--gold-d)}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}
</style>
<meta name="joc-inapoi" content="clasa1.html">
<link rel="stylesheet" href="joc.css">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
<div id="game-container">
  <canvas id="c"></canvas>
  <div id="ui-layer">
    <div class="stat-box" id="score">Scor: 0</div>
    <div class="stat-box" id="lives">❤️❤️❤️</div>
  </div>
  <div id="hint">Mișcă gaina și prinde ouăle 🥚 Ferește-te de bombe 💣</div>
  <div id="game-over">
    <div class="big">🥚</div>
    <h1>Încearcă din nou!</h1>
    <p id="final-score">Scor final: 0</p>
    <p id="best"></p>
    <button onclick="restartGame()">Joacă din nou</button>
  </div>
</div>

<script>
const container=document.getElementById('game-container'),cv=document.getElementById('c'),ctx=cv.getContext('2d'),
scoreElement=document.getElementById('score'),livesElement=document.getElementById('lives'),gameOverScreen=document.getElementById('game-over');
const W=360,H=640,GROUND=592,RIM=508,R=Math.min(3,Math.max(2,Math.round(window.devicePixelRatio||2)));
cv.width=W*R;cv.height=H*R;

let score=0,lives=3,gameActive=true;
let best=0;try{best=+localStorage.getItem('gaina-record')||0}catch(e){}
let objs=[],fx=[],time=0,spawnT=900,bombStreak=0,shake=0,flash=0,uid=0;
const P={x:180,tx:180,v:0,lean:0,bounce:0,happy:0,hurt:0,blink:150};
const keys={left:0,right:0};

// micșorează/mărește jocul ca să încapă pe orice ecran
let scale=1;
function fit(){scale=Math.min((innerHeight-16)/652,(innerWidth-8)/372,1.5);container.style.transform='scale('+scale+')'}
addEventListener('resize',fit);addEventListener('orientationchange',fit);fit();

// ---------- decor (desenat o singură dată) ----------
const TRAYS=[[0,150,130],[0,380,115],[360,100,285],[360,262,232]].map(([x1,y1,x2])=>{
  const y2=y1+Math.abs(x2-x1)*.364,len=Math.hypot(x2-x1,y2-y1),ux=(x2-x1)/len,uy=(y2-y1)/len;
  let nx=uy,ny=-ux;if(ny>0){nx=-nx;ny=-ny}
  return{x1,y1,x2,y2,len,ux,uy,nx,ny,dir:Math.sign(x2-x1),pulse:0};
});
function layer(fn){const c=document.createElement('canvas');c.width=W*R;c.height=H*R;const g=c.getContext('2d');g.scale(R,R);fn(g);return c}
const sky=layer(g=>{
  let gr=g.createLinearGradient(0,0,0,H);
  [[0,'#4B2391'],[.45,'#9A5FDB'],[.78,'#F59BC4'],[1,'#FFD59A']].forEach(s=>gr.addColorStop(s[0],s[1]));
  g.fillStyle=gr;g.fillRect(0,0,W,H);
  g.fillStyle='#fff';
  for(let i=0;i<34;i++){g.globalAlpha=.3+(i*37%10)/16;g.beginPath();g.arc((i*97)%W,(i*53)%250,(i%3)*.5+.8,0,7);g.fill()}
  g.globalAlpha=1;
  gr=g.createRadialGradient(96,530,10,96,530,95);
  gr.addColorStop(0,'#FFE9A0');gr.addColorStop(.5,'rgba(255,200,120,.55)');gr.addColorStop(1,'rgba(255,200,120,0)');
  g.fillStyle=gr;g.fillRect(0,420,260,220);
  g.fillStyle='#FFE08A';g.beginPath();g.arc(96,530,40,0,7);g.fill();
});
const front=layer(g=>{
  g.fillStyle='#6A3BA0';g.beginPath();g.moveTo(0,H);
  for(let x=0;x<=W;x+=10)g.lineTo(x,540+Math.sin(x/55)*16);
  g.lineTo(W,H);g.fill();
  g.fillStyle='#52B26B';g.beginPath();g.moveTo(0,H);
  for(let x=0;x<=W;x+=10)g.lineTo(x,578+Math.sin(x/40+2)*9);
  g.lineTo(W,H);g.fill();
  g.fillStyle='#3F9A55';g.fillRect(0,600,W,40);
  g.strokeStyle='#2F7D44';g.lineWidth=2;g.lineCap='round';
  for(let x=8;x<W;x+=22){g.beginPath();g.moveTo(x,H-6);g.lineTo(x-3,H-15);g.moveTo(x+5,H-6);g.lineTo(x+7,H-16);g.stroke()}
  TRAYS.forEach(T=>{
    const ax=T.x1-T.ux*14,ay=T.y1-T.uy*14;
    [[18,'#4A2C17',0],[12,'#A8734A',0],[3,'#C99A6B',3]].forEach(([w,c,o])=>{
      g.strokeStyle=c;g.lineWidth=w;g.beginPath();
      g.moveTo(ax+T.nx*o,ay+T.ny*o);g.lineTo(T.x2+T.nx*o,T.y2+T.ny*o);g.stroke();
    });
  });
});

// ---------- desen: personaje și obiecte ----------
function drawHen(T){
  ctx.save();
  if(T.dir<0){ctx.translate(W,0);ctx.scale(-1,1)}
  ctx.translate(0,T.y1);ctx.scale(1,1+T.pulse*.15);
  ctx.lineWidth=3;ctx.strokeStyle='#F2B705';ctx.fillStyle='#FFE24A';
  ctx.beginPath();ctx.ellipse(-2,-20,22,20,0,0,7);ctx.fill();ctx.stroke();
  ctx.fillStyle='#F44336';ctx.strokeStyle='#B71C1C';ctx.lineWidth=2;
  [[3,-41,5],[10,-39,4.5]].forEach(c=>{ctx.beginPath();ctx.arc(c[0],c[1],c[2],0,7);ctx.fill();ctx.stroke()});
  ctx.fillStyle='#FF9800';ctx.strokeStyle='#E65100';
  ctx.beginPath();ctx.moveTo(18,-24);ctx.lineTo(27,-20);ctx.lineTo(18,-16);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.fillStyle='#1a1a1a';ctx.beginPath();ctx.arc(10,-27,3.3,0,7);ctx.fill();
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(9,-28,1.2,0,7);ctx.fill();
  ctx.fillStyle='rgba(255,120,140,.55)';ctx.beginPath();ctx.ellipse(13,-17,4,2.5,0,0,7);ctx.fill();
  ctx.restore();
}
function chicken(frontPass){
  ctx.save();ctx.translate(P.x,596);ctx.rotate(P.lean);ctx.scale(1+P.bounce*.07,1-P.bounce*.09);
  ctx.lineCap='round';ctx.lineJoin='round';
  if(!frontPass){
    ctx.fillStyle='#FF9800';
    [-12,12].forEach(x=>{ctx.beginPath();ctx.ellipse(x,-1,9,4,0,0,7);ctx.fill()});
    ctx.lineWidth=3;ctx.strokeStyle='#F2B705';ctx.fillStyle='#FFD21F';
    [-1,1].forEach(s=>{ctx.beginPath();ctx.ellipse(s*37,-50,8,19,s*.35,0,7);ctx.fill();ctx.stroke()});
    ctx.fillStyle='#FFE24A';ctx.beginPath();ctx.ellipse(0,-30,34,30,0,0,7);ctx.fill();ctx.stroke();
    ctx.fillStyle='#FFF3A8';ctx.beginPath();ctx.ellipse(0,-19,20,13,0,0,7);ctx.fill();
    const hap=P.happy>0,hurt=P.hurt>0,bl=P.blink<0;
    [-1,1].forEach(s=>{
      const x=s*13,y=-36;
      ctx.strokeStyle='#1a1a1a';ctx.lineWidth=3;
      if(hurt){ctx.beginPath();ctx.moveTo(x+s*5,y-5);ctx.lineTo(x-s*4,y);ctx.lineTo(x+s*5,y+5);ctx.stroke()}
      else if(hap){ctx.beginPath();ctx.arc(x,y+3,5,Math.PI,0);ctx.stroke()}
      else if(bl){ctx.beginPath();ctx.moveTo(x-5,y+1);ctx.lineTo(x+5,y+1);ctx.stroke()}
      else{
        ctx.fillStyle='#1a1a1a';ctx.beginPath();ctx.ellipse(x,y,5.5,6.5,0,0,7);ctx.fill();
        ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x-1.8,y-2.5,2,0,7);ctx.fill();
      }
      ctx.fillStyle='rgba(255,120,140,.55)';ctx.beginPath();ctx.ellipse(s*23,-27,6,3.5,0,0,7);ctx.fill();
    });
    ctx.fillStyle='#FF9800';ctx.strokeStyle='#E65100';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(-6,-31);ctx.lineTo(6,-31);ctx.lineTo(0,-23);ctx.closePath();ctx.fill();ctx.stroke();
  }else{
    const path=()=>{ctx.beginPath();ctx.moveTo(-46,-88);ctx.lineTo(46,-88);ctx.lineTo(36,-48);ctx.quadraticCurveTo(0,-38,-36,-48);ctx.closePath()};
    path();ctx.fillStyle='#B07A47';ctx.fill();
    ctx.save();ctx.clip();ctx.strokeStyle='rgba(74,44,23,.35)';ctx.lineWidth=2;
    for(let i=-60;i<60;i+=12){ctx.beginPath();ctx.moveTo(i,-90);ctx.lineTo(i+30,-40);ctx.moveTo(i+30,-90);ctx.lineTo(i,-40);ctx.stroke()}
    ctx.restore();
    path();ctx.strokeStyle='#4A2C17';ctx.lineWidth=3;ctx.stroke();
    ctx.fillStyle='#D9A066';ctx.beginPath();ctx.roundRect(-50,-94,100,13,6);ctx.fill();ctx.stroke();
    ctx.fillStyle='#F44336';ctx.strokeStyle='#B71C1C';ctx.lineWidth=2;
    [[-8,-50,5],[0,-53,6.5],[8,-50,5]].forEach(c=>{ctx.beginPath();ctx.arc(c[0],c[1],c[2],0,7);ctx.fill();ctx.stroke()});
  }
  ctx.restore();
}
function eggPath(){ctx.beginPath();ctx.moveTo(0,-16);ctx.bezierCurveTo(10,-16,14,2,12,8);ctx.bezierCurveTo(10,14,5,16,0,16);ctx.bezierCurveTo(-5,16,-10,14,-12,8);ctx.bezierCurveTo(-14,2,-10,-16,0,-16);ctx.closePath()}
function drawObj(o){
  ctx.save();ctx.translate(o.x,o.y);
  if(o.kind==='bomb'){
    ctx.rotate(Math.sin(time*.12+o.id)*.35);
    let g=ctx.createRadialGradient(-5,-6,2,0,0,17);g.addColorStop(0,'#5A4A7A');g.addColorStop(1,'#241A38');
    ctx.fillStyle=g;ctx.strokeStyle='#12081F';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,15,0,7);ctx.fill();ctx.stroke();
    ctx.fillStyle='#777790';ctx.beginPath();ctx.roundRect(-5,-21,10,7,2);ctx.fill();
    ctx.strokeStyle='#C9A46B';ctx.lineWidth=2.5;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(0,-21);ctx.quadraticCurveTo(2,-28,8,-27);ctx.stroke();
    const f=2.5+Math.sin(time*.8)*1.2;
    ctx.fillStyle='#FF7043';ctx.beginPath();ctx.arc(8,-27,f+1.5,0,7);ctx.fill();
    ctx.fillStyle='#FFE082';ctx.beginPath();ctx.arc(8,-27,f*.6,0,7);ctx.fill();
    ctx.fillStyle='#fff';[-5.5,5.5].forEach(x=>{ctx.beginPath();ctx.arc(x,-1,3.4,0,7);ctx.fill()});
    ctx.fillStyle='#111';[-5.5,5.5].forEach(x=>{ctx.beginPath();ctx.arc(x,-.5,1.6,0,7);ctx.fill()});
    ctx.strokeStyle='#fff';ctx.lineWidth=1.8;
    ctx.beginPath();ctx.moveTo(-10,-7);ctx.lineTo(-3,-4.5);ctx.moveTo(10,-7);ctx.lineTo(3,-4.5);ctx.stroke();
    ctx.beginPath();ctx.arc(0,9,3.5,Math.PI,0);ctx.stroke();
  }else{
    const gold=o.kind==='gold';
    ctx.rotate(o.rot);eggPath();
    const g=ctx.createRadialGradient(-4,-6,2,0,0,18);
    if(gold){g.addColorStop(0,'#FFF8C2');g.addColorStop(1,'#FFB81C');ctx.shadowColor='#FFB81C';ctx.shadowBlur=14}
    else{g.addColorStop(0,'#fff');g.addColorStop(1,'#EADFCF')}
    ctx.fillStyle=g;ctx.fill();ctx.shadowBlur=0;
    ctx.lineWidth=1.8;ctx.strokeStyle=gold?'#D98E04':'#CDBEA8';ctx.stroke();
  }
  ctx.restore();
}

// ---------- efecte ----------
function burst(x,y,cols,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=1.5+Math.random()*sp;fx.push({t:'p',x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-1.5,l:0,m:30+Math.random()*20,c:cols[i%cols.length],z:2.5+Math.random()*3})}}
function say(txt,x,y,c){fx.push({t:'txt',txt,x,y,l:0,m:55,c})}
function hud(el){
  scoreElement.textContent='Scor: '+score;
  const n=Math.max(0,lives);livesElement.textContent='❤️'.repeat(n)+'🖤'.repeat(3-n);
  if(el){el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop')}
}
function lose(x,y,txt){lives--;P.hurt=40;shake=9;flash=1;say(txt,x,y,'#FF8A80');hud(livesElement);if(lives<=0)endGame()}

// ---------- logică ----------
function spawn(){
  const T=TRAYS[(Math.random()*TRAYS.length)|0];
  let kind='egg';
  if(bombStreak<2&&Math.random()<(score<4?.08:.24))kind='bomb';
  else if(score>=5&&Math.random()<.07)kind='gold';
  bombStreak=kind==='bomb'?bombStreak+1:0;
  const sv=.75+Math.random(),diff=Math.min(2.2,1+score/100);
  T.pulse=1;
  objs.push({id:uid++,kind,tray:T,dist:22,speed:2.6*sv*diff,rolling:true,x:T.x1,y:T.y1,vx:0,vy:0,g:.2*sv,r:kind==='bomb'?15:14,rot:0,spin:T.dir*.09*sv*diff});
}
function update(dt){
  const kx=keys.right-keys.left;if(kx&&gameActive)P.tx+=kx*7*dt;
  P.tx=Math.max(50,Math.min(310,P.tx));
  const x0=P.x;P.x+=(P.tx-P.x)*Math.min(1,.35*dt);P.v=(P.x-x0)/dt;
  P.lean+=(Math.max(-.16,Math.min(.16,P.v*.018))-P.lean)*.25;
  const d=Math.pow(.88,dt);P.bounce*=d;shake*=d;flash*=d;
  P.happy-=dt;P.hurt-=dt;P.blink-=dt;if(P.blink<-8)P.blink=120+Math.random()*180;
  TRAYS.forEach(T=>T.pulse*=d);
  if(gameActive){spawnT-=dt*16.67;if(spawnT<=0){spawn();spawnT=Math.max(380,1400-score*6)*(.75+Math.random()*.5)}}
  for(let i=objs.length-1;i>=0;i--){
    const o=objs[i];if(!o)continue;const T=o.tray;
    if(o.rolling){
      o.speed+=.018*dt;o.dist+=o.speed*dt;o.rot+=o.spin*dt;
      const k=Math.min(o.dist,T.len),h=o.r+6;
      o.x=T.x1+T.ux*k+T.nx*h;o.y=T.y1+T.uy*k+T.ny*h;
      if(o.dist>=T.len){o.rolling=false;o.vx=T.ux*o.speed*.55;o.vy=T.uy*o.speed*.8}
    }else{o.vy+=o.g*dt;o.x+=o.vx*dt;o.y+=o.vy*dt;o.rot+=o.spin*dt*.5}
    if(!o.rolling&&gameActive&&o.vy>0&&o.y+o.r>=RIM+4&&o.y<RIM+60&&Math.abs(o.x-P.x)<46){
      objs.splice(i,1);P.bounce=1;
      if(o.kind==='bomb'){burst(P.x,RIM,['#FFB81C','#FF7043','#444'],16,5);fx.push({t:'boom',x:P.x,y:RIM+6,l:0,m:26});lose(P.x,RIM-20,'BUM! -1')}
      else{
        const pts=o.kind==='gold'?5:1;score+=pts;P.happy=22;
        burst(P.x,RIM,o.kind==='gold'?['#FFB81C','#fff']:['#fff','#FFE24A'],10,3);
        say('+'+pts,P.x,RIM-18,o.kind==='gold'?'#FFB81C':'#fff');hud(scoreElement);
      }
      continue;
    }
    if(o.y>GROUND){
      objs.splice(i,1);
      if(o.kind==='bomb'){burst(o.x,GROUND+8,['#FF7043','#444'],8,3);fx.push({t:'boom',x:o.x,y:GROUND+8,l:0,m:22})}
      else{
        fx.push({t:'splat',x:o.x,y:GROUND+10,l:0,m:110});
        if(o.kind==='egg')lose(o.x,GROUND-30,'RATAT!');
      }
    }
  }
  for(let i=fx.length-1;i>=0;i--){
    const f=fx[i];f.l+=dt;
    if(f.t==='p'){f.x+=f.vx*dt;f.y+=f.vy*dt;f.vy+=.15*dt}
    else if(f.t==='txt')f.y-=.7*dt;
    if(f.l>=f.m)fx.splice(i,1);
  }
}
function draw(){
  ctx.setTransform(R,0,0,R,0,0);ctx.clearRect(0,0,W,H);
  ctx.save();if(shake>.3)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  ctx.drawImage(sky,0,0,W,H);
  ctx.fillStyle='rgba(255,255,255,.8)';
  [[0,70,1],[1,185,.7],[2,300,.85]].forEach(([i,y,s])=>{
    const x=(time*.12*s+i*150)%(W+140)-70;
    ctx.beginPath();ctx.arc(x,y,16*s,0,7);ctx.arc(x+18*s,y-8*s,20*s,0,7);ctx.arc(x+38*s,y,15*s,0,7);ctx.fill();
  });
  ctx.drawImage(front,0,0,W,H);
  TRAYS.forEach(drawHen);
  chicken(false);
  objs.forEach(drawObj);
  chicken(true);
  fx.forEach(f=>{
    const a=1-f.l/f.m;ctx.globalAlpha=Math.max(0,a);
    if(f.t==='p'){ctx.fillStyle=f.c;ctx.beginPath();ctx.arc(f.x,f.y,f.z*a+.5,0,7);ctx.fill()}
    else if(f.t==='boom'){ctx.fillStyle='rgba(255,170,40,.7)';ctx.beginPath();ctx.arc(f.x,f.y,10+f.l*2.2,0,7);ctx.fill()}
    else if(f.t==='splat'){
      const k=Math.min(f.l/8,1);
      ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(f.x,f.y,10+12*k,3+3*k,0,0,7);ctx.fill();
      ctx.fillStyle='#FFC107';ctx.beginPath();ctx.ellipse(f.x,f.y-1,5*k,3*k,0,0,7);ctx.fill();
    }else{
      ctx.font='700 22px Fredoka,"Trebuchet MS",sans-serif';ctx.textAlign='center';ctx.lineWidth=4;ctx.lineJoin='round';
      ctx.strokeStyle='rgba(35,27,51,.85)';ctx.strokeText(f.txt,f.x,f.y);ctx.fillStyle=f.c;ctx.fillText(f.txt,f.x,f.y);
    }
    ctx.globalAlpha=1;
  });
  ctx.restore();
  if(flash>.02){ctx.fillStyle='rgba(255,50,80,'+flash*.3+')';ctx.fillRect(0,0,W,H)}
}

function endGame(){
  gameActive=false;objs=[];
  const rec=score>best;
  if(rec){best=score;try{localStorage.setItem('gaina-record',best)}catch(e){}}
  document.getElementById('final-score').textContent='Scor final: '+score;
  document.getElementById('best').textContent=rec?'Record nou! 🎉':'Record: '+best;
  setTimeout(()=>{if(!gameActive)gameOverScreen.style.display='flex'},450);
}
function restartGame(){
  score=0;lives=3;gameActive=true;objs=[];fx=[];bombStreak=0;spawnT=700;P.tx=180;
  gameOverScreen.style.display='none';hud(scoreElement);hud(livesElement);
}

// ---------- control ----------
function point(e){if(!gameActive)return;const r=container.getBoundingClientRect();P.tx=(e.clientX-r.left)/(r.width/372)-6}
container.addEventListener('pointermove',point);
container.addEventListener('pointerdown',point);
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(k==='arrowleft'||k==='a')keys.left=1;else if(k==='arrowright'||k==='d')keys.right=1;else return;e.preventDefault()});
addEventListener('keyup',e=>{const k=e.key.toLowerCase();if(k==='arrowleft'||k==='a')keys.left=0;else if(k==='arrowright'||k==='d')keys.right=0});

let last=performance.now();
function frame(now){const dt=Math.min(2.5,Math.max(.1,(now-last)/16.667));last=now;time+=dt;update(dt);draw();requestAnimationFrame(frame)}
hud();requestAnimationFrame(frame);
</script>
