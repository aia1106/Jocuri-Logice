<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Codul Secret: un joc de logică în care descoperi combinația seifului.">
<meta name="theme-color" content="#d9dfe1">
<title>Codul Secret – Jocuri logice</title>
<style>
:root{
  --bg:#d9dfe1; --safe:#1f3a37; --safe-hi:#2d504b; --slot:#142926; --line:#47706a;
  --brass:#d0a24a; --ink:#12201e; --light:#eef4f2; --muted:#a9c2bd;
  --red:#e5484d; --blue:#2f6fe4; --green:#2fa866; --yellow:#f2c230;
  --display:Rockwell,"Roboto Slab","Rockwell Nova",Georgia,serif;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --pad:20px;
}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;padding:var(--pad) 14px;background:var(--bg);color:var(--ink);font:16px/1.4 var(--body);display:grid;justify-items:center;align-content:start}
:focus-visible{outline:3px solid #fff;outline-offset:2px;box-shadow:0 0 0 5px var(--ink)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Seiful ocupă tot ecranul disponibil, deci nu mai e nevoie de scroll. */
.safe{width:min(440px,100%);height:calc(100dvh - 2*var(--pad));min-height:600px;max-height:780px;
  display:flex;flex-direction:column;padding:12px;border-radius:22px;color:var(--light);
  background:linear-gradient(160deg,var(--safe-hi),var(--safe) 40%);
  box-shadow:inset 0 2px 0 #ffffff30,0 18px 40px #12201e40}
.door{flex:1;min-height:0;display:flex;flex-direction:column;border:2px solid var(--line);border-radius:14px;padding:12px}

.head{flex:none;display:flex;align-items:center;gap:12px;margin-bottom:8px}
.dial{flex:none;width:50px;height:50px;filter:drop-shadow(0 3px 4px #0006);transition:transform .7s cubic-bezier(.3,1.4,.5,1)}
.dial .face{fill:var(--brass);transition:fill .4s}
.won .dial .face{fill:var(--green)}
.lost .dial .face{fill:var(--red)}
h1{margin:0 0 4px;font:800 24px/1.05 var(--display)}
.code{display:flex;gap:6px}
.code .peg{width:24px;height:24px;font-size:12px}
.code .peg.empty{color:var(--muted)}

.meta{flex:none;display:flex;justify-content:space-between;align-items:center;margin:0 0 6px;font-size:14px;color:var(--muted)}
.link{padding:4px 0 4px 10px;background:none;border:0;color:var(--muted);font:600 14px var(--body);text-decoration:underline;cursor:pointer}

.board{flex:1;min-height:0;list-style:none;margin:0;padding:0;display:grid;grid-template-rows:repeat(var(--rows,10),minmax(0,1fr));gap:4px}
.row{--p:28px;min-height:0;display:grid;grid-template-columns:22px 1fr auto;align-items:center;gap:10px;padding:0 10px;border-radius:12px;background:var(--slot);border:2px solid transparent}
.row.now{border-color:var(--brass)}
/* Mărimea bilelor se adaptează la înălțimea tablei. */
@supports (height:1cqh){
  .board{container-type:size}
  .row{--p:clamp(18px,calc((100cqh - (var(--rows,10) - 1)*4px)/var(--rows,10) - 6px),36px)}
}
.n{font-size:13px;color:var(--muted);text-align:center}
.pegs{display:flex;gap:10px}
.peg{width:var(--p);height:var(--p);font-size:calc(var(--p)*.5);border-radius:50%;display:grid;place-items:center;line-height:1;border:0;padding:0;font-family:inherit;box-shadow:inset 0 2px 3px #ffffff55,0 2px 3px #0006}
.peg.empty{background:transparent;border:2px dashed var(--line);box-shadow:none}
button.peg{cursor:pointer}
.c0,.c1,.c2{color:#fff}
.c0{background:var(--red)}
.c1{background:var(--blue)}
.c2{background:var(--green)}
.c3{background:var(--yellow);color:var(--ink)}

.fb{display:flex;gap:4px}
.fb i,.legend i{border-radius:50%;border:2px solid var(--line)}
.fb i{width:max(9px,calc(var(--p)*.36));height:max(9px,calc(var(--p)*.36))}
i.ok{background:var(--brass);border-color:var(--brass)}
i.near{border-color:var(--light)}
.legend{flex:none;display:flex;flex-wrap:wrap;gap:2px 14px;margin:8px 0 0;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:11px;height:11px}

.palette{flex:none;display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:10px 0 8px}
.pick{height:clamp(40px,7dvh,58px);border:0;border-radius:14px;font-size:22px;cursor:pointer;box-shadow:inset 0 2px 3px #ffffff55,0 4px 0 #0007}
.pick:active:not(:disabled){transform:translateY(3px);box-shadow:inset 0 2px 3px #ffffff55,0 1px 0 #0007}
.pick:disabled{opacity:.3;cursor:not-allowed}

.actions{flex:none;display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:8px}
.btn{min-height:42px;padding:0 8px;border-radius:12px;border:2px solid var(--line);background:transparent;color:var(--light);font:600 15px var(--body);cursor:pointer}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary{background:var(--brass);border-color:var(--brass);color:var(--ink);font-weight:800}
.status{flex:none;min-height:20px;margin:8px 0 0;text-align:center;font-size:14px}

dialog{width:min(380px,calc(100% - 28px));padding:26px 24px;border:0;border-radius:18px;background:var(--safe);color:var(--light);text-align:center;box-shadow:0 20px 60px #0009}
dialog::backdrop{background:#12201ecc}
dialog h2{margin:0 0 6px;font:800 26px var(--display)}
dialog p{margin:0;color:var(--muted)}
dialog .btn{width:100%}
.reveal{display:flex;justify-content:center;gap:10px;margin:18px 0}
.reveal .peg{width:48px;height:48px;font-size:22px}

@media (max-width:480px){
  :root{--pad:6px}
  body{padding-inline:6px}
  .safe{padding:8px;border-radius:16px}
  .door{padding:10px 10px 8px}
  .pegs{gap:8px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<main class="safe" id="safe">
  <div class="door">
    <header class="head">
      <svg class="dial" id="dial" viewBox="0 0 64 64" aria-hidden="true">
        <circle cx="32" cy="32" r="31" fill="#c9d3d1"/>
        <circle cx="32" cy="32" r="26" fill="none" stroke="#12201e" stroke-width="4" stroke-dasharray="1.5 4.3"/>
        <circle class="face" cx="32" cy="32" r="17"/>
        <path d="M32 17v15" stroke="#12201e" stroke-width="4" stroke-linecap="round"/>
      </svg>
      <div>
        <h1>Codul Secret</h1>
        <div class="code" id="code" aria-hidden="true"></div>
      </div>
    </header>

    <div class="meta">
      <span id="counter"></span>
      <button class="link" id="newGame" type="button">Joc nou</button>
    </div>

    <ol class="board" id="board" aria-label="Încercările tale"></ol>
    <p class="legend">
      <span><i class="ok"></i>culoare și loc corecte</span>
      <span><i class="near"></i>doar culoarea</span>
    </p>

    <div class="palette" id="palette" role="group" aria-label="Alege o culoare"></div>
    <div class="actions">
      <button class="btn" id="undo" type="button">Șterge</button>
      <button class="btn" id="hint" type="button">Indiciu</button>
      <button class="btn primary" id="check" type="button">Verifică</button>
    </div>
    <p class="status" id="status" role="status"></p>
  </div>
</main>

<dialog id="end" aria-labelledby="endTitle">
  <h2 id="endTitle"></h2>
  <p id="endText"></p>
  <div class="reveal" id="reveal"></div>
  <button class="btn primary" id="playAgain" type="button">Joc nou</button>
</dialog>

<script>
// Setări: poți schimba aici culorile, lungimea codului și numărul de încercări.
const COLORS=[
  {name:"Roșu",sym:"▲",cls:"c0"},
  {name:"Albastru",sym:"■",cls:"c1"},
  {name:"Verde",sym:"◆",cls:"c2"},
  {name:"Galben",sym:"★",cls:"c3"}
];
const LEN=3, MAX=10, MAX_HINTS=2;

const $=id=>document.getElementById(id);
const safe=$("safe"),dial=$("dial"),board=$("board"),palette=$("palette"),codeEl=$("code"),
      statusEl=$("status"),counter=$("counter"),
      undoBtn=$("undo"),hintBtn=$("hint"),checkBtn=$("check"),end=$("end");

let secret,guess,tries,over,hintsLeft,revealed;

function el(tag,cls,text){
  const e=document.createElement(tag);
  if(cls)e.className=cls;
  if(text!=null)e.textContent=text;
  return e;
}
function peg(i,tag){
  return el(tag||"span","peg "+(i==null?"empty":COLORS[i].cls),i==null?"":COLORS[i].sym);
}

// Amestec Fisher-Yates (sort(()=>Math.random()-.5) nu e uniform).
function makeSecret(){
  const a=COLORS.map((_,i)=>i);
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a.slice(0,LEN);
}

// Culorile sunt unice și în cod, și în încercare, deci scorul e simplu.
function score(g,s){
  const black=g.filter((c,i)=>c===s[i]).length;
  const white=g.filter(c=>s.includes(c)).length-black;
  return {black,white};
}

function render(){
  board.replaceChildren();
  for(let r=0;r<MAX;r++){
    const t=tries[r];
    const now=!t&&r===tries.length&&!over;
    const li=el("li","row"+(now?" now":""));
    const pegs=el("span","pegs");
    const fb=el("span","fb");
    fb.setAttribute("aria-hidden","true");

    for(let k=0;k<LEN;k++){
      if(t){
        pegs.appendChild(peg(t.guess[k]));
      }else if(now&&guess[k]!=null){
        const b=peg(guess[k],"button");
        b.type="button";
        b.setAttribute("aria-label","Scoate "+COLORS[guess[k]].name);
        b.onclick=()=>{guess.splice(k,1);render();};
        pegs.appendChild(b);
      }else{
        pegs.appendChild(peg(null));
      }
      fb.appendChild(el("i",t?(k<t.black?"ok":k<t.black+t.white?"near":""):""));
    }

    const n=el("span","n",r+1);
    n.setAttribute("aria-hidden","true");
    li.append(n,pegs,fb);
    if(t){
      pegs.setAttribute("aria-hidden","true");
      li.appendChild(el("span","sr",
        `Încercarea ${r+1}: ${t.guess.map(i=>COLORS[i].name).join(", ")}. ${t.black} la loc corect, ${t.white} la loc greșit.`));
    }
    board.appendChild(li);
  }

  // Codul din antet: „?” până când primești un indiciu sau jocul se termină.
  codeEl.replaceChildren(...secret.map((c,k)=>
    revealed.includes(k)||over?peg(c):el("span","peg empty","?")));

  [...palette.children].forEach((b,i)=>{
    b.disabled=over||guess.includes(i)||guess.length>=LEN;
  });
  undoBtn.disabled=over||!guess.length;
  checkBtn.disabled=over||guess.length!==LEN;
  hintBtn.disabled=over||hintsLeft<1;
  hintBtn.textContent=`Indiciu (${hintsLeft})`;
  counter.textContent=over?`${tries.length} din ${MAX} încercări`:`Încercarea ${tries.length+1} din ${MAX}`;
}

function pick(i){
  if(over||guess.length>=LEN||guess.includes(i))return;
  guess.push(i);
  statusEl.textContent=guess.length===LEN?"Apasă Verifică.":"";
  render();
}

function check(){
  if(over||guess.length!==LEN)return;
  const g=[...guess],res=score(g,secret);
  tries.push({guess:g,...res});
  guess=[];
  dial.style.transform=`rotate(${tries.length*55}deg)`;

  if(res.black===LEN){
    over=true;
    safe.classList.add("won");
    statusEl.textContent="Seif deschis!";
    setTimeout(()=>finish(true),700);
  }else if(tries.length>=MAX){
    over=true;
    safe.classList.add("lost");
    statusEl.textContent="Nu mai ai încercări.";
    setTimeout(()=>finish(false),500);
  }else{
    statusEl.textContent=`${res.black} la loc corect, ${res.white} la loc greșit.`;
  }
  render();
}

function hint(){
  const free=[...Array(LEN).keys()].filter(k=>!revealed.includes(k));
  if(over||hintsLeft<1||!free.length)return;
  const k=free[Math.floor(Math.random()*free.length)];
  revealed.push(k);
  hintsLeft--;
  statusEl.textContent=`Poziția ${k+1} este ${COLORS[secret[k]].name}.`;
  render();
}

function finish(won){
  const n=tries.length;
  $("endTitle").textContent=won?"Seif deschis!":"Seiful a rămas închis";
  $("endText").textContent=won
    ?`Ai găsit codul în ${n} ${n===1?"încercare":"încercări"}.`
    :"Codul secret era:";
  $("reveal").replaceChildren(...secret.map(i=>peg(i)));
  if(typeof end.showModal==="function")end.showModal();
  else end.setAttribute("open","");
}

function closeEnd(){
  if(typeof end.close==="function")end.close();
  else end.removeAttribute("open");
}

function start(){
  secret=makeSecret();
  guess=[];tries=[];over=false;
  hintsLeft=MAX_HINTS;revealed=[];
  safe.classList.remove("won","lost");
  dial.style.transform="";
  statusEl.textContent=`Alege ${LEN} culori diferite.`;
  render();
}

board.style.setProperty("--rows",MAX);

COLORS.forEach((c,i)=>{
  const b=el("button","pick "+c.cls,c.sym);
  b.type="button";
  b.title=c.name;
  b.setAttribute("aria-label",c.name);
  b.onclick=()=>pick(i);
  palette.appendChild(b);
});

undoBtn.onclick=()=>{if(!over){guess.pop();statusEl.textContent="";render();}};
hintBtn.onclick=hint;
checkBtn.onclick=check;
$("playAgain").onclick=()=>{closeEnd();start();};
$("newGame").onclick=()=>{
  if(tries.length&&!over&&!confirm("Începi un joc nou? Încercările de acum se pierd."))return;
  start();
};

start();
</script>
</body>
</html>
